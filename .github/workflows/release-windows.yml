name: Windows installer

# Push a tag like v0.2.0 → builds Pittig-Finances-Setup-0.2.0.exe and publishes it as a GitHub
# Release (the installed app updates itself from there).
# "Run workflow" by hand → builds the installer and attaches it to the run as an artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the tag as app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build && npm run build:electron
      - name: Package and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Pittig-Finances-Setup
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
