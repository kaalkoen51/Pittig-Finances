name: Windows installer

# Push a tag like v0.2.0 → builds Pittig-Finances-Setup-0.2.0.exe and publishes it as a GitHub
# Release (the installed app updates itself from there).
# "Run workflow" by hand without a version → builds the installer and attaches it to the run as an
# artifact only. With a version (e.g. 1.0.0) → also publishes it as GitHub Release v1.0.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as a release, e.g. 1.0.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the tag as app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Use the typed version as app version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build && npm run build:electron
      # electron-builder uploads the installer and its update files in parallel; if the release does
      # not exist yet, both uploads try to create it and one fails ("must have a valid tag").
      # Creating the release first avoids that race.
      - name: Make sure the GitHub release exists
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "${TAG#v}" --notes "Pittig Finances ${TAG#v}"
      - name: Package and publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.version == '' }}
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Pittig-Finances-Setup
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
